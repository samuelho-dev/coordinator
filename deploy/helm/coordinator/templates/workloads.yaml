{{- $repository := required "image.repository is required" .Values.image.repository -}}
{{- $digest := required "image.digest is required" .Values.image.digest -}}
{{- $sha := required "sourceSha is required" .Values.sourceSha -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) }}{{ fail "image.digest must be sha256 plus 64 lowercase hexadecimal digits" }}{{ end -}}
{{- if not (regexMatch "^[a-f0-9]{40}$" $sha) }}{{ fail "sourceSha must be the full 40-character source commit" }}{{ end -}}
{{- if not (regexMatch "^[^@\\s]+$" $repository) }}{{ fail "image.repository must not contain a digest or whitespace" }}{{ end -}}
{{- $settings := .Values.inspector -}}
{{- $secret := required "inspector.existingSecret is required" $settings.existingSecret -}}
{{- $caSecret := .Values.tls.existingCaSecret -}}
{{- if hasKey $settings.podAnnotations "checksum/values" }}{{ fail "podAnnotations must not override checksum/values" }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-inspector
  {{- with $settings.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coordinator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: inspector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coordinator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: inspector
      annotations:
        checksum/values: {{ toJson .Values | sha256sum }}
        {{- with $settings.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stage-config
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --input-type=module
            - -e
            - |
              import { Effect, FileSystem } from 'effect';
              import { NodeRuntime, NodeServices } from '@effect/platform-node';
              NodeRuntime.runMain(Effect.gen(function* () {
                const fs = yield* FileSystem.FileSystem;
                yield* fs.makeDirectory('/config/private', { mode: 0o700, recursive: true });
                yield* fs.chmod('/config/private', 0o700);
                for (const name of ['inspector.json', 'health.token']) {
                  const destination = `/config/private/${name}`;
                  yield* fs.writeFile(destination, yield* fs.readFile(`/input/${name}`), { mode: 0o600 });
                  yield* fs.chmod(destination, 0o600);
                }
              }).pipe(Effect.provide(NodeServices.layer)));
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: input, mountPath: /input, readOnly: true}
            - {name: config, mountPath: /config}
      containers:
        - name: inspector
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, dist/src/main.js, inspector]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - {name: COORDINATOR_CONFIG, value: /config/private/inspector.json}
            - {name: COORDINATOR_EXPECTED_SOURCE_SHA, value: {{ $sha | quote }}}
            - {name: HOME, value: /tmp}
            {{- if $caSecret }}
            - {name: NODE_EXTRA_CA_CERTS, value: /etc/coordinator/ca/ca.crt}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ $settings.port }}, protocol: TCP}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - node
                - --input-type=module
                - -e
                - |
                  import { Config, Effect, FileSystem, Option } from 'effect';
                  import { Headers, HttpClient } from 'effect/http';
                  import { NodeHttpClient, NodeRuntime, NodeServices } from '@effect/platform-node';
                  NodeRuntime.runMain(Effect.gen(function* () {
                    const fs = yield* FileSystem.FileSystem;
                    const token = (yield* fs.readFileString('/config/private/health.token')).trim();
                    if (!token || /[\r\n]/.test(token)) return yield* Effect.fail('Invalid health token');
                    const expectedSha = yield* Config.String('COORDINATOR_EXPECTED_SOURCE_SHA');
                    const response = yield* HttpClient.get('http://127.0.0.1:{{ $settings.port }}/readyz', {
                      headers: { authorization: `Bearer ${token}` }
                    }).pipe(Effect.timeout('3 seconds'));
                    if (response.status < 200 || response.status >= 300 ||
                        Option.getOrUndefined(Headers.get(response.headers, 'x-coordinator-source-sha')) !== expectedSha) {
                      return yield* Effect.fail('Readiness failed');
                    }
                  }).pipe(
                    Effect.scoped,
                    Effect.provide(NodeHttpClient.layerNodeHttp),
                    Effect.provide(NodeServices.layer)
                  ), { disableErrorReporting: true });
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $caSecret }}
            - {name: ca, mountPath: /etc/coordinator/ca, readOnly: true}
            {{- end }}
      volumes:
        - name: input
          secret:
            secretName: {{ $secret | quote }}
            defaultMode: 0440
            items:
              - {key: inspector.json, path: inspector.json}
              - {key: health.token, path: health.token}
        - name: config
          emptyDir: {medium: Memory}
        - name: tmp
          emptyDir: {}
        {{- if $caSecret }}
        - name: ca
          secret:
            secretName: {{ $caSecret | quote }}
            defaultMode: 0444
            items:
              - {key: ca.crt, path: ca.crt}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-inspector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: coordinator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: inspector
  ports:
    - {name: http, port: {{ $settings.port }}, targetPort: http, protocol: TCP}
