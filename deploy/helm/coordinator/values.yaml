image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent
sourceSha: ""
# ponytail: fence both owners during the offline database cutover.
suspended: false
imagePullSecrets: []
nodeSelector:
  kubernetes.io/arch: amd64
# ponytail: Kubernetes validates native toleration fields.
tolerations: []
tls:
  existingCaSecret: ""
broker:
  existingSecret: ""
  deploymentAnnotations: {}
  podAnnotations: {}
  port: 8787
  connectHosts: {}
  extraEnv: []
  resources: {}
runner:
  enabled: false
  existingSecret: ""
  deploymentAnnotations: {}
  podAnnotations: {}
  port: 8788
  connectHosts: {}
  extraEnv: []
  resources: {}
persistence:
  backups:
    existingClaim: ""
    storageClass: null
    size: 10Gi
    accessModes: [ReadWriteOnce]
  work:
    existingClaim: ""
    storageClass: null
    size: 20Gi
    accessModes: [ReadWriteOnce]
# TLS termination and NetworkPolicies are operator-owned integration inputs.
# No ingress, provider CRDs, HPA, or public service are created.
