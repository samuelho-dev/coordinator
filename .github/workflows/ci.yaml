name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coordinator-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  supplementary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Run isolated native suite outside private runner home
        run: |
          TEST_ROOT="$(mktemp -d /tmp/coordinator-test.XXXXXX)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          chmod 0755 "$TEST_ROOT"
          cp -a package.json tsconfig.json packages src scripts test dist node_modules "$TEST_ROOT/"
          chmod -R a+rX "$TEST_ROOT"
          mkdir -m 0700 "$TEST_ROOT/private-home"
          export HOME="$TEST_ROOT/private-home"
          cd "$TEST_ROOT"
          # Temporary await metadata; no test/SDK changes or disposal behavior.
          cat > ci-native-await.mjs <<'JS'
          import { createHook } from "node:async_hooks";
          Error.stackTraceLimit = 30;
          const pending = new Map();
          createHook({
            init(id, type, trigger) {
              if (type !== "PROMISE") return;
              const stack = new Error().stack;
              if (!stack?.includes("/test/") || !stack.includes(".test.ts:") || stack.includes("Test.createSubtest")) return;
              const callsite = stack.split("\n").find((line) => line.includes("/test/") && line.includes(".test.ts:"));
              if (pending.size < 128) pending.set(id, { id, trigger, callsite, stack });
            },
            promiseResolve(id) { pending.delete(id); },
            destroy(id) { pending.delete(id); },
          }).enable();
          setInterval(() => {
            process.stderr.write(`[CI-NATIVE-AWAIT] ${JSON.stringify({ pid: process.pid, at: Date.now(), pending: [...pending.values()] })}\n`);
          }, 30000).unref();
          JS
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs /usr/bin/bash -ec '
            for test_file in test/*.test.ts; do
              printf "[CI-NATIVE-FILE] start %s\n" "$test_file"
              if [ "$test_file" = "test/runner.test.ts" ]; then
                node --import tsx --import ./ci-native-await.mjs --test --test-concurrency=1 "$test_file"
              else
                node --import tsx --test --test-concurrency=1 "$test_file"
              fi
              printf "[CI-NATIVE-FILE] done %s\n" "$test_file"
            done
          '
      - name: Run stock public controls and real broker plugin smoke
        run: |
          TEST_ROOT="$(mktemp -d /tmp/coordinator-hosts.XXXXXX)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          chmod 0755 "$TEST_ROOT"
          # Clone only Git objects/refs, never checkout credentials, hooks, or local config.
          git clone --no-hardlinks --no-checkout . "$TEST_ROOT"
          git -C "$TEST_ROOT" remote set-url origin "$(git remote get-url origin)"
          git -C "$TEST_ROOT" update-ref --no-deref HEAD "$(git rev-parse HEAD)"
          cp -a package.json tsconfig.json packages src scripts dist node_modules "$TEST_ROOT/"
          chmod -R a+rX "$TEST_ROOT"
          mkdir -m 0700 "$TEST_ROOT/private-home"
          export HOME="$TEST_ROOT/private-home"
          export COORDINATOR_TEST_PI="$TEST_ROOT/node_modules/.bin/pi"
          export COORDINATOR_TEST_OMP="$TEST_ROOT/node_modules/.bin/omp"
          export COORDINATOR_TEST_PI_VERSION='1.0.4'
          export COORDINATOR_TEST_OMP_VERSION='omp/18.6.1'
          cd "$TEST_ROOT"
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME,COORDINATOR_TEST_PI,COORDINATOR_TEST_OMP,COORDINATOR_TEST_PI_VERSION,COORDINATOR_TEST_OMP_VERSION /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs "$(command -v node)" --import tsx scripts/host-smoke.ts
  # Stock controls and broker delivery do not admit whole-run prompt/outcome proof.
  # Ghostty rendering and real keyboard input remain separate acceptance.
