name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coordinator-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  supplementary:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: go run ./cmd/build
      - run: go test -race ./...
      - run: go vet ./...
      - run: pnpm check
      - name: Exercise ephemeral inspector and Pi/OMP native startup without provider calls
        env:
          COORDINATOR_BINARY: dist/bin/linux-x64/coordinator
        run: go run ./cmd/smoke

  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
          - {runner: macos-15-intel, target: darwin-x64}
          - {runner: macos-15, target: darwin-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: go run ./cmd/build
        env:
          COORDINATOR_BUILD_TARGETS: ${{ matrix.target }}
          COORDINATOR_IMAGE_SHA: ${{ github.sha }}
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'
      - run: go vet ./...
        env:
          CGO_ENABLED: '1'
      - run: go run ./cmd/smoke
        env:
          COORDINATOR_BINARY: dist/bin/${{ matrix.target }}/coordinator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/bin/${{ matrix.target }}/coordinator
          if-no-files-found: error
          retention-days: 30
      - name: Archive accepted native binary
        run: |
          mkdir -p binary-evidence
          tar -czf binary-evidence/coordinator-${{ matrix.target }}.tar.gz -C dist/bin/${{ matrix.target }} coordinator -C "$GITHUB_WORKSPACE" LICENSE
          (cd binary-evidence && shasum -a 256 *.tar.gz > SHA256SUMS-${{ matrix.target }})
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-archive-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: binary-evidence/
          if-no-files-found: error
          retention-days: 30

  npm-package:
    needs: [native]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: go run ./cmd/build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*-${{ github.sha }}-${{ github.run_attempt }}
          path: binaries
      - name: Assemble all four accepted native executables
        run: |
          set -euo pipefail
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            install -m 0755 "binaries/binary-$target-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT/coordinator" "dist/bin/$target/coordinator" -D
          done
      - name: Pack the built public payload once
        run: |
          set -euo pipefail
          mkdir npm-evidence
          npm pack --ignore-scripts --json --pack-destination npm-evidence > "$RUNNER_TEMP/npm-pack.json"
          ARCHIVE="$(jq -er 'if length == 1 then .[0].filename else error("expected one package") end' "$RUNNER_TEMP/npm-pack.json")"
          mv "npm-evidence/$ARCHIVE" npm-evidence/package.tgz
      - name: Accept clean production-only packed installation and native extensions
        run: go run ./cmd/package-smoke --release npm-evidence/package.tgz
      - name: Bind accepted tarball to exact CI source
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          tar -xOf npm-evidence/package.tgz package/package.json > "$RUNNER_TEMP/packed-package.json"
          jq -e '.name == "@samuelho-dev/coordinator" and .private != true and (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)-beta\\.[1-9][0-9]*$"))' "$RUNNER_TEMP/packed-package.json"
          HASH="$(sha256sum npm-evidence/package.tgz | cut -d' ' -f1)"
          jq -n --slurpfile package "$RUNNER_TEMP/packed-package.json" --arg repo "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg run "$RUN_ID" --arg attempt "$RUN_ATTEMPT" --arg hash "$HASH" '{repository:$repo,sourceSha:$sha,ciRunId:$run,ciRunAttempt:$attempt,gate:"npm-package",packageName:$package[0].name,packageVersion:$package[0].version,archiveSha256:$hash,acceptance:"production-only-packed-native-install"}' > npm-evidence/npm.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-${{ github.sha }}-${{ github.run_attempt }}
          path: npm-evidence/
          if-no-files-found: error
          retention-days: 30

  chart:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Lint, render, reject invalid inputs, and package generic chart
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CHART=deploy/helm/coordinator
          VERSION="$(helm show chart "$CHART" | ruby -ryaml -e 'puts YAML.load(STDIN.read)["version"]')"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]
          VALUES="$RUNNER_TEMP/chart-values.json"
          jq -n --arg sha "$SOURCE_SHA" --arg image "ghcr.io/${REPOSITORY,,}" '{image:{repository:$image,digest:("sha256:"+("a"*64))},sourceSha:$sha,inspector:{existingSecret:"inspector-input"},legacyStorage:{mode:"fresh"}}' > "$VALUES"
          helm lint --strict "$CHART" -f "$VALUES"
          helm template acceptance "$CHART" -f "$VALUES" > "$RUNNER_TEMP/chart-render.yaml"
          ruby -ryaml -e 'docs=YAML.load_stream(File.read(ARGV[0])).compact; deployments=docs.select{|d| d["kind"]=="Deployment"}; abort "unexpected workloads" unless deployments.map{|d| d.dig("metadata","name")}==["acceptance-inspector"]; deployments.each{|d| s=d.dig("spec","template","spec"); (s.fetch("containers")+s.fetch("initContainers",[])).each{|c| abort "mutable image" unless c["image"]==ARGV[1]; abort "unsafe container" unless c.dig("securityContext","readOnlyRootFilesystem")==true && c.dig("securityContext","allowPrivilegeEscalation")==false && c.dig("securityContext","capabilities","drop")==["ALL"]}; e=s["containers"][0]["env"]; abort "source mismatch" unless e.any?{|v| v["name"]=="COORDINATOR_EXPECTED_SOURCE_SHA" && v["value"]==ARGV[2]}; abort "baked revision override" if e.any?{|v| v["name"]=="COORDINATOR_IMAGE_SHA"}; abort "legacy volume" if s.fetch("volumes",[]).any?{|v| v.key?("persistentVolumeClaim")}}; abort "fresh install creates PVC" if docs.any?{|d| d["kind"]=="PersistentVolumeClaim"}; abort "private service required" unless docs.select{|d| d["kind"]=="Service"}.all?{|d| d.dig("spec","type")=="ClusterIP"}' "$RUNNER_TEMP/chart-render.yaml" "ghcr.io/${REPOSITORY,,}@sha256:$(printf 'a%.0s' {1..64})" "$SOURCE_SHA"
          ruby -ryaml -e 's=YAML.load_stream(File.read(ARGV[0])).compact.find{|d| d["kind"]=="Deployment"}.dig("spec","template","spec"); abort "wrong init" unless s["initContainers"][0]["command"]==%w[coordinator stage-config --input /input --destination /config/private]; c=s["containers"][0]; abort "wrong server" unless c["command"]==%w[coordinator inspector]; abort "wrong readiness" unless c.dig("readinessProbe","exec","command")==["coordinator","health","--url","http://127.0.0.1:8787","--token-file","/config/private/health.token","--source-sha",ARGV[1]]' "$RUNNER_TEMP/chart-render.yaml" "$SOURCE_SHA"
          jq '.tls.existingCaSecret="ca-input"' "$VALUES" > "$RUNNER_TEMP/ca-values.json"
          helm template acceptance "$CHART" -f "$RUNNER_TEMP/ca-values.json" > "$RUNNER_TEMP/ca-render.yaml"
          ruby -ryaml -e 'c=YAML.load_stream(File.read(ARGV[0])).compact.find{|d| d["kind"]=="Deployment"}.dig("spec","template","spec","containers",0); abort "wrong CA" unless c["env"].any?{|e| e["name"]=="SSL_CERT_FILE" && e["value"]=="/etc/coordinator/ca/ca.crt"}' "$RUNNER_TEMP/ca-render.yaml"
          jq '.legacyStorage={mode:"retain",claims:[{name:"legacy-backups",size:"1Gi",accessModes:["ReadWriteOnce"],storageClass:null}]}' "$VALUES" > "$RUNNER_TEMP/retain-values.json"
          helm template acceptance "$CHART" -f "$RUNNER_TEMP/retain-values.json" > "$RUNNER_TEMP/retain-render.yaml"
          ruby -ryaml -e 'd=YAML.load_stream(File.read(ARGV[0])).compact; p=d.select{|x| x["kind"]=="PersistentVolumeClaim"}; abort "retention inventory mismatch" unless p.map{|x| x.dig("metadata","name")}==["legacy-backups"]; p.each{|x| a=x.dig("metadata","annotations"); abort "unsafe retention" unless a["helm.sh/resource-policy"]=="keep" && a["argocd.argoproj.io/sync-options"]=="Prune=false,Delete=false"}; abort "legacy mount" if d.select{|x| x["kind"]=="Deployment"}.any?{|x| x.dig("spec","template","spec","volumes").any?{|v| v.key?("persistentVolumeClaim")}}' "$RUNNER_TEMP/retain-render.yaml"
          if helm template invalid "$CHART" >/dev/null 2>&1; then echo 'Missing required inputs accepted' >&2; exit 1; fi
          for override in 'image.repository=' 'image.digest=' 'image.digest=latest' 'sourceSha=' 'sourceSha=abc' 'inspector.existingSecret=' 'inspector.existingSecret=Bad/Name' 'legacyStorage.mode=' 'legacyStorage.mode=retain' 'runner.enabled=true' 'broker.port=8787' 'inspector.extraEnv[0].name=COORDINATOR_DATABASE_URL'; do
            if helm template invalid "$CHART" -f "$VALUES" --set-string "$override" >/dev/null 2>&1; then echo "Invalid input accepted: $override" >&2; exit 1; fi
          done
          for port in 0 65536; do
            if helm template invalid "$CHART" -f "$VALUES" --set "inspector.port=$port" >/dev/null 2>&1; then echo "Invalid port accepted: $port" >&2; exit 1; fi
          done
          mkdir -p chart-evidence
          helm package "$CHART" --destination chart-evidence
          helm template packaged "chart-evidence/coordinator-$VERSION.tgz" -f "$VALUES" > "$RUNNER_TEMP/packaged-render.yaml"
          HASH="$(sha256sum "chart-evidence/coordinator-$VERSION.tgz" | cut -d' ' -f1)"
          jq -n --arg repo "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg run "$RUN_ID" --arg version "$VERSION" --arg hash "$HASH" '{repository:$repo,sourceSha:$sha,ciRunId:$run,gate:"chart",chartVersion:$version,chartArchiveSha256:$hash}' > chart-evidence/chart.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chart-${{ github.sha }}
          path: chart-evidence/
          if-no-files-found: error

  publish:
    needs: [supplementary, native, chart, npm-package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: coordinator-dind-runners
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require current main source before producing an image
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
      - name: Derive repository-owned image coordinate
        id: coordinates
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.coordinates.outputs.image }}:${{ github.sha }}
          build-args: COORDINATOR_IMAGE_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prove read-only inspector in exact production image
        env:
          IMAGE: ${{ steps.coordinates.outputs.image }}@${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          NAME="coordinator-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SEED="$NAME-seed"
          VOLUME="$NAME-config"
          trap 'docker rm -f "$NAME" "$SEED" >/dev/null 2>&1 || true; docker volume rm "$VOLUME" >/dev/null 2>&1 || true; rm -rf "$ROOT"' EXIT
          TOKEN="$(cat /proc/sys/kernel/random/uuid)"
          HASH="$(printf %s "$TOKEN" | sha256sum | cut -d' ' -f1)"
          printf '{"host":"0.0.0.0","port":8787,"principals":[{"id":"owner","owner":"smoke","tokenHash":"%s"}]}' "$HASH" > "$ROOT/inspector.json"
          printf %s "$TOKEN" > "$ROOT/health.token"
          printf '{"inspectorUrl":"http://127.0.0.1:8787","tokenFile":"/config/health.token"}' > "$ROOT/connector.json"
          printf '{"inspectorUrl":"http://127.0.0.1:8787","tokenFile":"/config/bad.token"}' > "$ROOT/bad-connector.json"
          printf 'invalid-token' > "$ROOT/bad.token"
          chmod 700 "$ROOT"
          chmod 600 "$ROOT/"*
          # DinD has its own filesystem; seed private files without host chown or bind mounts.
          docker volume create "$VOLUME" >/dev/null
          docker create --name "$SEED" --user 0:0 --mount "type=volume,source=$VOLUME,target=/config" --entrypoint sh node:24.21.0-bookworm-slim -c 'cp /seed/* /config/ && chown -R 1000:1000 /config && chmod 700 /config && chmod 600 /config/*' >/dev/null
          docker cp "$ROOT/." "$SEED:/seed"
          docker start -a "$SEED"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$SEED")" = 0
          docker rm "$SEED" >/dev/null
          docker run -d --name "$NAME" --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 -p 127.0.0.1::8787 --mount "type=volume,source=$VOLUME,target=/config,readonly" -e HOME=/tmp -e COORDINATOR_CONFIG=/config/inspector.json "$IMAGE"
          PORT="$(docker port "$NAME" 8787/tcp | awk -F: '{print $NF}')"
          for attempt in {1..30}; do
            if docker exec "$NAME" coordinator health --url http://127.0.0.1:8787 --token-file /config/health.token --source-sha "$SOURCE_SHA"; then break; fi
            test "$attempt" -lt 30
            sleep 1
          done
          if docker exec "$NAME" coordinator health --url http://127.0.0.1:8787 --token-file /config/health.token --source-sha 0000000000000000000000000000000000000000; then echo 'Incorrect source accepted' >&2; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/readyz")" = 401
          curl -fsS -D "$ROOT/headers" -o /dev/null -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/readyz"
          grep -iq "^x-coordinator-source-sha: $SOURCE_SHA" "$ROOT/headers"
          docker exec -e COORDINATOR_CONNECTOR_CONFIG=/config/connector.json "$NAME" coordinator list | jq -e '(.machines | type=="array") and (.sessions | type=="array") and .nextCursor==null'
          if docker exec -e COORDINATOR_CONNECTOR_CONFIG=/config/bad-connector.json "$NAME" coordinator list; then echo 'Invalid MCP credential accepted' >&2; exit 1; fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attest exact image source
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.coordinates.outputs.image }}@${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          INVOCATION: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          # Kyverno verifyImages consumes legacy cosign storage.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --registry-referrers-mode=legacy "$IMAGE"
          jq -n --arg repo "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg ref "$SOURCE_REF" --arg invocation "$INVOCATION" '{buildDefinition:{buildType:"https://actions.github.io/buildtypes/workflow/v1",externalParameters:{repository:$repo,ref:$ref,sha:$sha},resolvedDependencies:[{uri:("git+https://github.com/"+$repo),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:("https://github.com/"+$repo+"/.github/workflows/ci.yaml@"+$ref)},metadata:{invocationId:$invocation}}}' > "$RUNNER_TEMP/provenance.json"
          cosign attest --yes --new-bundle-format=false --use-signing-config=false --type https://slsa.dev/provenance/v1 --predicate "$RUNNER_TEMP/provenance.json" "$IMAGE"
          cosign verify --certificate-identity "https://github.com/$REPOSITORY/.github/workflows/ci.yaml@$SOURCE_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          cosign verify-attestation --type https://slsa.dev/provenance/v1 --certificate-identity "https://github.com/$REPOSITORY/.github/workflows/ci.yaml@$SOURCE_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          printf 'Image: `%s`\nSource SHA: `%s`\n' "$IMAGE" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Record immutable producer coordinates
        env:
          IMAGE_REPOSITORY: ${{ steps.coordinates.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p release-evidence
          jq -n --arg repository "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg image "$IMAGE_REPOSITORY" --arg digest "$IMAGE_DIGEST" --arg run "$RUN_ID" '{repository:$repository,sourceSha:$sha,imageRepository:$image,imageDigest:$digest,ciRunId:$run,platform:"linux/amd64",protocol:"2026-07-28",product:"native-session-inspector",acceptance:"ephemeral-authenticated-read-only-inspection"}' > release-evidence/image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ github.sha }}
          path: release-evidence/image.json
          if-no-files-found: error
