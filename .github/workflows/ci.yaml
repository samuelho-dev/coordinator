name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coordinator-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  supplementary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Run isolated native suite outside private runner home
        run: |
          TEST_ROOT="$(mktemp -d /tmp/coordinator-test.XXXXXX)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          chmod 0755 "$TEST_ROOT"
          cp -a package.json tsconfig.json packages src scripts test dist node_modules "$TEST_ROOT/"
          chmod -R a+rX "$TEST_ROOT"
          mkdir -m 0700 "$TEST_ROOT/private-home"
          export HOME="$TEST_ROOT/private-home"
          cd "$TEST_ROOT"
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs "$(command -v node)" --import tsx --test --test-concurrency=1 test/*.test.ts
      - name: Run stock public controls and real broker plugin smoke
        run: |
          TEST_ROOT="$(mktemp -d /tmp/coordinator-hosts.XXXXXX)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          chmod 0755 "$TEST_ROOT"
          # Clone only Git objects/refs, never checkout credentials, hooks, or local config.
          git clone --no-hardlinks --no-checkout . "$TEST_ROOT"
          git -C "$TEST_ROOT" remote set-url origin "$(git remote get-url origin)"
          git -C "$TEST_ROOT" update-ref --no-deref HEAD "$(git rev-parse HEAD)"
          cp -a package.json tsconfig.json packages src scripts dist node_modules "$TEST_ROOT/"
          chmod -R a+rX "$TEST_ROOT"
          mkdir -m 0700 "$TEST_ROOT/private-home"
          export HOME="$TEST_ROOT/private-home"
          export COORDINATOR_TEST_PI="$TEST_ROOT/node_modules/.bin/pi"
          export COORDINATOR_TEST_OMP="$TEST_ROOT/node_modules/.bin/omp"
          export COORDINATOR_TEST_PI_VERSION='1.0.4'
          export COORDINATOR_TEST_OMP_VERSION='omp/18.6.1'
          cd "$TEST_ROOT"
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME,COORDINATOR_TEST_PI,COORDINATOR_TEST_OMP,COORDINATOR_TEST_PI_VERSION,COORDINATOR_TEST_OMP_VERSION /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs "$(command -v node)" --import tsx scripts/host-smoke.ts
  # Stock CLIs exercise plugin-owned SDK admission/outcomes against a private local provider.
  # Ghostty rendering and real keyboard input remain separate acceptance.

  publish:
    needs: supplementary
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact private source without Git credential configuration
        run: git bundle create coordinator-source.bundle HEAD && git bundle verify coordinator-source.bundle
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/samuelho-dev/coordinator:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/samuelho-dev/coordinator
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attest exact image source
        env:
          IMAGE: ghcr.io/samuelho-dev/coordinator@${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          INVOCATION: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          # Kyverno verifyImages consumes legacy cosign storage.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --registry-referrers-mode=legacy "$IMAGE"
          jq -n --arg repo "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg ref "$SOURCE_REF" --arg invocation "$INVOCATION" '{buildDefinition:{buildType:"https://actions.github.io/buildtypes/workflow/v1",externalParameters:{repository:$repo,ref:$ref,sha:$sha},resolvedDependencies:[{uri:("git+https://github.com/"+$repo),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:("https://github.com/"+$repo+"/.github/workflows/ci.yaml@"+$ref)},metadata:{invocationId:$invocation}}}' > "$RUNNER_TEMP/provenance.json"
          cosign attest --yes --new-bundle-format=false --use-signing-config=false --type https://slsa.dev/provenance/v1 --predicate "$RUNNER_TEMP/provenance.json" "$IMAGE"
          cosign verify --certificate-identity "https://github.com/$REPOSITORY/.github/workflows/ci.yaml@$SOURCE_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          cosign verify-attestation --type https://slsa.dev/provenance/v1 --certificate-identity "https://github.com/$REPOSITORY/.github/workflows/ci.yaml@$SOURCE_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          printf 'Image: `%s`\nSource SHA: `%s`\n' "$IMAGE" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
