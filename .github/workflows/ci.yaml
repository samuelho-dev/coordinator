name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coordinator-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  supplementary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: pnpm install --frozen-lockfile
      - name: Reproduce committed database contracts and check actual generated ESM
        run: |
          set -euo pipefail
          EXPECTED="$(mktemp -d "$RUNNER_TEMP/coordinator-generated.XXXXXX")"
          trap 'rm -rf -- "$EXPECTED"' EXIT
          cp -a src/generated/. "$EXPECTED/"
          pnpm check
          diff --recursive --unified "$EXPECTED" src/generated
      - name: Provision disposable loopback PostgreSQL 18
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          sudo ln -sf /usr/lib/postgresql/18/bin/pg_dump /usr/bin/pg_dump
          sudo ln -sf /usr/lib/postgresql/18/bin/pg_restore /usr/bin/pg_restore
          umask 077
          mkdir "$RUNNER_TEMP/coordinator-postgres"
          node --import tsx --input-type=module <<'NODE'
          import { Effect } from 'effect';
          import { Hex } from 'effect/encoding';
          import { Platform } from './src/platform.ts';
          await Effect.runPromise(Effect.gen(function*() {
            const platform = yield* Platform;
            const directory = platform.path.join(process.env.RUNNER_TEMP, 'coordinator-postgres');
            const password = Hex.encode(yield* platform.crypto.randomBytes(32));
            yield* platform.fs.writeFileString(platform.path.join(directory, 'password'), password, { flag: 'wx', mode: 0o600 });
            yield* platform.fs.writeFileString(platform.path.join(directory, 'database.url'), `postgresql://postgres:${password}@127.0.0.1:55432/postgres?sslmode=disable`, { flag: 'wx', mode: 0o600 });
          }).pipe(Effect.provide(Platform.layer))).catch(() => {
            console.error('Disposable PostgreSQL credential provisioning failed; diagnostics withheld');
            process.exitCode = 1;
          });
          NODE
          /usr/lib/postgresql/18/bin/initdb -D "$RUNNER_TEMP/coordinator-postgres/data" --username=postgres --auth-local=trust --auth-host=scram-sha-256 --pwfile="$RUNNER_TEMP/coordinator-postgres/password"
          /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/coordinator-postgres/data" -l "$RUNNER_TEMP/coordinator-postgres/server.log" -o "-h 127.0.0.1 -p 55432 -k ''" -w start
          rm "$RUNNER_TEMP/coordinator-postgres/password"
          printf 'COORDINATOR_TEST_POSTGRES_URL_FILE=%s/coordinator-postgres/database.url\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run isolated native suite outside private runner home
        run: |
          TEST_ROOT="$(mktemp -d /tmp/coordinator-test.XXXXXX)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          chmod 0755 "$TEST_ROOT"
          cp -a package.json tsconfig.json prisma.config.ts prisma migrations packages src scripts test dist node_modules "$TEST_ROOT/"
          chmod -R a+rX "$TEST_ROOT"
          mkdir -m 0700 "$TEST_ROOT/private-home"
          export HOME="$TEST_ROOT/private-home"
          cd "$TEST_ROOT"
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME,COORDINATOR_TEST_POSTGRES_URL_FILE /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs "$(command -v node)" --import tsx --test --test-concurrency=1 test/*.test.ts
      - name: Run stock public controls, broker plugin, offline recovery and legacy import smokes
        run: |
          TEST_ROOT="$(mktemp -d /tmp/coordinator-hosts.XXXXXX)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          chmod 0755 "$TEST_ROOT"
          # Clone only Git objects/refs, never checkout credentials, hooks, or local config.
          git clone --no-hardlinks --no-checkout . "$TEST_ROOT"
          git -C "$TEST_ROOT" remote set-url origin "$(git remote get-url origin)"
          git -C "$TEST_ROOT" update-ref --no-deref HEAD "$(git rev-parse HEAD)"
          cp -a package.json tsconfig.json prisma.config.ts prisma migrations packages src scripts test dist node_modules "$TEST_ROOT/"
          chmod -R a+rX "$TEST_ROOT"
          mkdir -m 0700 "$TEST_ROOT/private-home"
          export HOME="$TEST_ROOT/private-home"
          export COORDINATOR_TEST_PI="$TEST_ROOT/node_modules/.bin/pi"
          export COORDINATOR_TEST_OMP="$TEST_ROOT/node_modules/.bin/omp"
          export COORDINATOR_TEST_PI_VERSION='1.0.4'
          export COORDINATOR_TEST_OMP_VERSION='omp/18.6.1'
          cd "$TEST_ROOT"
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME,COORDINATOR_TEST_POSTGRES_URL_FILE,COORDINATOR_TEST_PI,COORDINATOR_TEST_OMP,COORDINATOR_TEST_PI_VERSION,COORDINATOR_TEST_OMP_VERSION /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs "$(command -v node)" --import tsx scripts/host-smoke.ts
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME,COORDINATOR_TEST_POSTGRES_URL_FILE /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs "$(command -v node)" --import tsx scripts/recovery-smoke.ts
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME,COORDINATOR_TEST_POSTGRES_URL_FILE /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs "$(command -v node)" --import tsx scripts/import-smoke.ts
      - name: Remove disposable PostgreSQL and credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/coordinator-postgres/data/postmaster.pid" ]; then
            /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/coordinator-postgres/data" -m immediate -w stop
          fi
          rm -rf -- "$RUNNER_TEMP/coordinator-postgres"
  # Stock CLIs exercise plugin-owned SDK admission/outcomes against a private local provider.
  # Ghostty rendering and real keyboard input remain separate acceptance.

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Lint, render, reject invalid inputs, and package generic chart
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          CHART=deploy/helm/coordinator
          VERSION="$(helm show chart "$CHART" | ruby -ryaml -e 'puts YAML.load(STDIN.read)["version"]')"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]
          VALUES="$RUNNER_TEMP/chart-values.json"
          jq -n --arg sha "$SOURCE_SHA" --arg image "ghcr.io/${REPOSITORY,,}" '{image:{repository:$image,digest:("sha256:"+("a"*64))},sourceSha:$sha,broker:{existingSecret:"broker-input"},runner:{enabled:true,existingSecret:"runner-input"}}' > "$VALUES"
          helm lint --strict "$CHART" -f "$VALUES"
          helm template acceptance "$CHART" -f "$VALUES" > "$RUNNER_TEMP/chart-render.yaml"
          ruby -ryaml -e 'docs=YAML.load_stream(File.read(ARGV[0])).compact; deployments=docs.select{|d| d["kind"]=="Deployment"}; abort "missing broker/runner" unless deployments.map{|d| d.dig("metadata","name")}.sort==["acceptance-broker","acceptance-runner"]; deployments.each{|d| s=d.dig("spec","template","spec"); abort "mutable image or missing init" unless (s["containers"]+s["initContainers"]).all?{|c| c["image"]==ARGV[1]}; abort "source mismatch" unless s["containers"][0]["env"].any?{|e| e["name"]=="COORDINATOR_IMAGE_SHA" && e["value"]==ARGV[2]}}; abort "missing persistence" unless docs.count{|d| d["kind"]=="PersistentVolumeClaim"}==2' "$RUNNER_TEMP/chart-render.yaml" "ghcr.io/${REPOSITORY,,}@sha256:$(printf 'a%.0s' {1..64})" "$SOURCE_SHA"
          helm template broker-only "$CHART" -f "$VALUES" --set runner.enabled=false > "$RUNNER_TEMP/broker-render.yaml"
          ruby -ryaml -e 'd=YAML.load_stream(File.read(ARGV[0])).compact; abort "runner unexpectedly enabled" unless d.select{|x| x["kind"]=="Deployment"}.map{|x| x.dig("metadata","name")}==["broker-only-broker"]' "$RUNNER_TEMP/broker-render.yaml"
          if helm template invalid "$CHART" >/dev/null 2>&1; then echo 'Missing required inputs accepted' >&2; exit 1; fi
          for override in 'image.repository=' 'image.digest=' 'image.digest=latest' 'sourceSha=' 'sourceSha=abc' 'broker.existingSecret=' 'broker.existingSecret=Bad/Name' 'runner.existingSecret='; do
            if helm template invalid "$CHART" -f "$VALUES" --set-string "$override" >/dev/null 2>&1; then echo "Invalid input accepted: $override" >&2; exit 1; fi
          done
          for port in 0 65536; do
            if helm template invalid "$CHART" -f "$VALUES" --set "broker.port=$port" >/dev/null 2>&1; then echo "Invalid port accepted: $port" >&2; exit 1; fi
          done
          mkdir -p chart-evidence
          helm package "$CHART" --destination chart-evidence
          helm template packaged "chart-evidence/coordinator-$VERSION.tgz" -f "$VALUES" > "$RUNNER_TEMP/packaged-render.yaml"
          HASH="$(sha256sum "chart-evidence/coordinator-$VERSION.tgz" | cut -d' ' -f1)"
          jq -n --arg repo "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg run "$RUN_ID" --arg version "$VERSION" --arg hash "$HASH" '{repository:$repo,sourceSha:$sha,ciRunId:$run,gate:"chart",chartVersion:$version,chartArchiveSha256:$hash}' > chart-evidence/chart.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chart-${{ github.sha }}
          path: chart-evidence/
          if-no-files-found: error

  publish:
    needs: [supplementary, chart]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Derive repository-owned image coordinate
        id: coordinates
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.coordinates.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prove committed migrations and broker startup in exact production image
        env:
          IMAGE: ${{ steps.coordinates.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          PG_ROOT="$(mktemp -d "$RUNNER_TEMP/coordinator-image-postgres.XXXXXX")"
          PG_CONTAINER="coordinator-image-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_CONTAINER="coordinator-image-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$IMAGE_CONTAINER" "$PG_CONTAINER" >/dev/null 2>&1 || true
            sudo rm -rf -- "$PG_ROOT"
          }
          trap cleanup EXIT
          mkdir "$PG_ROOT/config"
          timeout --signal=TERM --kill-after=5s 120s docker run --rm --interactive --name "$IMAGE_CONTAINER" --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --mount "type=bind,src=$PG_ROOT,dst=/proof" --env HOME=/tmp "$IMAGE" node --import tsx --input-type=module <<'NODE'
          import { Effect } from 'effect';
          import { Hex } from 'effect/encoding';
          import { Platform } from './src/platform.ts';
          await Effect.runPromise(Effect.gen(function*() {
            const platform = yield* Platform;
            const password = Hex.encode(yield* platform.crypto.randomBytes(32));
            yield* platform.fs.writeFileString('/proof/password', password, { flag: 'wx', mode: 0o600 });
            yield* platform.fs.writeFileString('/proof/config/database.url', `postgresql://postgres:${password}@127.0.0.1:55433/postgres?sslmode=disable`, { flag: 'wx', mode: 0o600 });
          }).pipe(Effect.provide(Platform.layer))).catch(() => {
            console.error('Production image PostgreSQL credential provisioning failed; diagnostics withheld');
            process.exitCode = 1;
          });
          NODE
          sudo chown 999:999 "$PG_ROOT/password"
          sudo chown -R 1000:1000 "$PG_ROOT/config"
          docker run --detach --rm --name "$PG_CONTAINER" --publish 127.0.0.1:55433:5432 --mount "type=bind,src=$PG_ROOT/password,dst=/run/secrets/postgres-password,readonly" --env POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password postgres:18 >/dev/null
          ready=false
          for attempt in {1..60}; do
            if docker exec "$PG_CONTAINER" pg_isready --host=127.0.0.1 --username=postgres --dbname=postgres >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo 'Disposable PostgreSQL did not become ready' >&2; exit 1; fi
          image_run() {
            timeout --signal=TERM --kill-after=5s 120s docker run --rm --interactive --name "$IMAGE_CONTAINER" --network host --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --mount "type=bind,src=$PG_ROOT/config,dst=/config,readonly" --env HOME=/tmp --env COORDINATOR_DATABASE_URL_FILE=/config/database.url "$IMAGE" "$@"
          }
          image_run node --import tsx scripts/migrate.ts
          image_run node --import tsx scripts/migrate.ts
          image_run node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Layer, ManagedRuntime, Schema } from 'effect';
          import { Broker } from './src/broker.ts';
          import { BrokerConfig } from './src/contracts.ts';
          import { assertBrokerSchema } from './src/database.ts';
          import { Mcp } from './src/http.ts';
          import { Platform } from './src/platform.ts';
          const config = Schema.decodeUnknownSync(BrokerConfig)({
            databaseUrlFile: '/config/database.url', host: '127.0.0.1', port: 0,
            principals: [], repositoryIds: {}, backupDirectory: '/tmp/backups',
            archiveRetentionMs: 86400000, backupRetentionMs: 3600000
          });
          const runtime = ManagedRuntime.make(Broker.layer(config).pipe(Layer.provide(Layer.merge(Platform.layer, Mcp.layer))));
          try {
            const broker = await runtime.runPromise(Broker);
            await runtime.runPromise(assertBrokerSchema(broker.sql));
            const address = broker.server.address;
            assert.equal(address._tag, 'InetAddressV4');
            const response = await fetch(`http://127.0.0.1:${address.port}/livez`);
            assert.equal(response.status, 200);
            assert.deepEqual(await response.json(), { status: 'ok' });
          } catch {
            console.error('Production image migration/startup proof failed; credentials and diagnostics withheld');
            process.exitCode = 1;
          } finally {
            await runtime.dispose();
          }
          NODE
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attest exact image source
        env:
          IMAGE: ${{ steps.coordinates.outputs.image }}@${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          INVOCATION: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          # Kyverno verifyImages consumes legacy cosign storage.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --registry-referrers-mode=legacy "$IMAGE"
          jq -n --arg repo "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg ref "$SOURCE_REF" --arg invocation "$INVOCATION" '{buildDefinition:{buildType:"https://actions.github.io/buildtypes/workflow/v1",externalParameters:{repository:$repo,ref:$ref,sha:$sha},resolvedDependencies:[{uri:("git+https://github.com/"+$repo),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:("https://github.com/"+$repo+"/.github/workflows/ci.yaml@"+$ref)},metadata:{invocationId:$invocation}}}' > "$RUNNER_TEMP/provenance.json"
          cosign attest --yes --new-bundle-format=false --use-signing-config=false --type https://slsa.dev/provenance/v1 --predicate "$RUNNER_TEMP/provenance.json" "$IMAGE"
          cosign verify --certificate-identity "https://github.com/$REPOSITORY/.github/workflows/ci.yaml@$SOURCE_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          cosign verify-attestation --type https://slsa.dev/provenance/v1 --certificate-identity "https://github.com/$REPOSITORY/.github/workflows/ci.yaml@$SOURCE_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          printf 'Image: `%s`\nSource SHA: `%s`\n' "$IMAGE" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Record immutable producer coordinates
        env:
          IMAGE_REPOSITORY: ${{ steps.coordinates.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p release-evidence
          jq -n --arg repository "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg image "$IMAGE_REPOSITORY" --arg digest "$IMAGE_DIGEST" --arg run "$RUN_ID" '{repository:$repository,sourceSha:$sha,imageRepository:$image,imageDigest:$digest,ciRunId:$run,platform:"linux/amd64",protocol:"2026-07-28",pi:"1.0.4",omp:"18.6.1"}' > release-evidence/image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ github.sha }}
          path: release-evidence/image.json
          if-no-files-found: error
