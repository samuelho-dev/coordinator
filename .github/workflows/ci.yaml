name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coordinator-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  supplementary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Run isolated native suite outside private runner home
        run: |
          TEST_ROOT="$(mktemp -d /tmp/coordinator-test.XXXXXX)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          chmod 0755 "$TEST_ROOT"
          cp -a package.json tsconfig.json packages src scripts test dist node_modules "$TEST_ROOT/"
          chmod -R a+rX "$TEST_ROOT"
          mkdir -m 0700 "$TEST_ROOT/private-home"
          export HOME="$TEST_ROOT/private-home"
          cd "$TEST_ROOT"
          # Temporary readonly default-root close metadata; no test or SDK file changes.
          cat > native-root-close-preload.mjs <<'JS'
          if (process.argv.some((arg) => arg.endsWith("/runner.test.ts") || arg === "test/runner.test.ts")) {
            const { createHook } = await import("node:async_hooks");
            const tests = new Map();
            createHook({
              init(id, type, trigger, resource) { if (type === "Test") tests.set(id, resource); },
              before(id) { const name = tests.get(id)?.name; if (name) process.stderr.write(`[OWNED-TEST-START] ${JSON.stringify({ name, at: Date.now() })}\n`); },
              destroy(id) { tests.delete(id); },
            }).enable();
            const { Context, Effect, Layer } = await import("effect");
            const { Mcp } = await import("./src/http.ts");
            const { begin, end, close } = await import("./root-close-worker-observer.mjs");
            const { after } = await import("node:test");
            after(() => close());
            // Observe the actual default-root disposal fiber; do not change SDK, test, request or disposal behavior.
            Mcp.layer = Mcp.layer.pipe(Layer.tap((context) => Effect.sync(() => {
              const service = Context.get(context, Mcp);
              const serve = service.serve;
              service.serve = (server, options) => Effect.gen(function*() {
                yield* Effect.addFinalizer(() => end);
                yield* serve(server, options);
                yield* Effect.addFinalizer(() => begin({ target: options.target, address: server.address }));
              });
            })));
          }
          JS
          cat > root-close-worker-observer.mjs <<'JS'
          import { Effect } from "effect";
          import { Worker } from "node:worker_threads";
          const roots = new Map();
          const acknowledgements = new Map();
          let requestId = 0;
          const request = (kind, remaining) => new Promise((resolve) => { const id = ++requestId; acknowledgements.set(id, resolve); worker.postMessage({ kind, remaining, id }); });
          export const captured = [];
          globalThis.__ownedRootCloseFibers = roots;
          globalThis.__ownedRootAsyncEvaluate = Effect.callback(() => undefined)["~effect/Effect/evaluate"];
          const env = { ...process.env };
          delete env.NODE_TEST_CONTEXT;
          const worker = new Worker(new URL("./root-close-debugger-worker.mjs", import.meta.url), { execArgv: [], env });
          await new Promise((resolve, reject) => {
            worker.once("error", reject);
            worker.on("message", ({ marker, value }) => {
              if (marker === "ready") { resolve(); return; }
              if (marker === "ack") { acknowledgements.get(value.id)?.(); acknowledgements.delete(value.id); return; }
              if (marker === "OWNED-ROOT-ASYNC") captured.push(value);
              process.stderr.write(`[${marker}] ${JSON.stringify(value)}\n`);
            });
          });
          worker.unref();
          export const begin = (owner) => Effect.withFiber((fiber) => Effect.promise(async () => { roots.set(fiber.id, owner); await request("begin"); process.stderr.write(`[OWNED-ROOT-CLOSE-BEGIN] ${JSON.stringify({ id: fiber.id, owner })}\n`); }));
          export const end = Effect.withFiber((fiber) => Effect.promise(async () => { roots.delete(fiber.id); await request("end", roots.size); process.stderr.write(`[OWNED-ROOT-CLOSE-END] ${JSON.stringify({ id: fiber.id })}\n`); }));
          export async function close() { const exited = new Promise((resolve) => worker.once("exit", resolve)); worker.ref(); worker.postMessage("close"); await exited; }
          process.once("beforeExit", () => worker.terminate());
          JS
          cat > root-close-debugger-worker.mjs <<'JS'
          import { Session } from "node:inspector";
          import { basename } from "node:path";
          import { parentPort } from "node:worker_threads";
          const inspector = new Session();
          inspector.connectToMainThread();
          const scripts = new Map();
          const registers = new Map();
          const send = (method, params) => new Promise((resolve, reject) => inspector.post(method, params, (error, result) => error ? reject(error) : resolve(result)));
          const report = (marker, value) => parentPort.postMessage({ marker, value });
          inspector.on("Debugger.scriptParsed", ({ params }) => scripts.set(params.scriptId, params.url));
          const state = `(object) => ({ id: typeof object?.id === "number" ? object.id : undefined, isOpen: typeof object?._isOpen === "boolean" ? object._isOpen : undefined, waiters: object?.waiters?.length, scheduled: object?.scheduled?.length, queueState: object?.state?._tag, messages: object?.messages?.length, capacity: object?.capacity, deferredDone: object && Object.hasOwn(object, "effect") ? object.effect !== undefined : undefined, resumes: object?.resumes?.length })`;
          inspector.on("Debugger.paused", ({ params }) => {
            void (async () => {
              const frame = params.callFrames[0];
              try {
                const registered = params.hitBreakpoints?.map((id) => registers.get(id)).find(Boolean);
                if (registered) {
                  const target = await send("Debugger.evaluateOnCallFrame", { callFrameId: frame.callFrameId, expression: `({ lexicalThis: (${state})(this), self: typeof self === "object" ? (${state})(self) : undefined, impl: typeof impl === "object" ? (${state})(impl) : undefined })`, returnByValue: true });
                  report("OWNED-ROOT-ASYNC", { ...registered, targets: target.result.value });
                  for (const id of params.hitBreakpoints ?? []) if (registers.has(id)) { await send("Debugger.removeBreakpoint", { breakpointId: id }); registers.delete(id); }
                  return;
                }
                const metadata = await send("Debugger.evaluateOnCallFrame", { callFrameId: frame.callFrameId, expression: `({ id: fiber.id, operation: this["~effect/Effect/identifier"], interruptible: fiber.interruptible, owner: globalThis.__ownedRootCloseFibers.get(fiber.id) })`, returnByValue: true });
                const register = await send("Debugger.evaluateOnCallFrame", { callFrameId: frame.callFrameId, expression: "this.register" });
                if (!register.result.objectId) return;
                const properties = await send("Runtime.getProperties", { objectId: register.result.objectId, ownProperties: true });
                const location = properties.internalProperties?.find((prop) => prop.name === "[[FunctionLocation]]")?.value?.value;
                const breakpoint = await send("Debugger.setBreakpointOnFunctionCall", { objectId: register.result.objectId });
                registers.set(breakpoint.breakpointId, { ...metadata.result.value, callback: location ? { file: basename(scripts.get(location.scriptId) ?? "unknown"), line: location.lineNumber + 1, column: location.columnNumber + 1 } : undefined });
              } catch (error) {
                report("OWNED-ROOT-ASYNC-ERROR", { name: error.name, message: error.message });
              } finally {
                await send("Debugger.resume", {}).catch(() => undefined);
              }
            })();
          });
          let evaluatorBreakpoint;
          parentPort.on("message", async (message) => {
            if (message.kind === "begin") {
              evaluatorBreakpoint ??= await send("Debugger.setBreakpointOnFunctionCall", { objectId: evaluator.result.objectId, condition: "globalThis.__ownedRootCloseFibers.has(fiber.id)" });
              report("ack", { id: message.id });
            } else if (message.kind === "end") {
              if (message.remaining === 0 && evaluatorBreakpoint) {
                await send("Debugger.removeBreakpoint", { breakpointId: evaluatorBreakpoint.breakpointId });
                evaluatorBreakpoint = undefined;
              }
              report("ack", { id: message.id });
            } else if (message === "close") {
              if (evaluatorBreakpoint) await send("Debugger.removeBreakpoint", { breakpointId: evaluatorBreakpoint.breakpointId });
              for (const breakpointId of registers.keys()) await send("Debugger.removeBreakpoint", { breakpointId });
              inspector.disconnect();
              parentPort.close();
            }
          });
          await send("Debugger.enable", {});
          const evaluator = await send("Runtime.evaluate", { expression: "globalThis.__ownedRootAsyncEvaluate" });
          report("ready", {});
          JS
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs "$(command -v node)" --import tsx --import ./native-root-close-preload.mjs --test --test-concurrency=1 test/*.test.ts
      - name: Run stock public controls and real broker plugin smoke
        run: |
          TEST_ROOT="$(mktemp -d /tmp/coordinator-hosts.XXXXXX)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          chmod 0755 "$TEST_ROOT"
          # Clone only Git objects/refs, never checkout credentials, hooks, or local config.
          git clone --no-hardlinks --no-checkout . "$TEST_ROOT"
          git -C "$TEST_ROOT" remote set-url origin "$(git remote get-url origin)"
          git -C "$TEST_ROOT" update-ref --no-deref HEAD "$(git rev-parse HEAD)"
          cp -a package.json tsconfig.json packages src scripts dist node_modules "$TEST_ROOT/"
          chmod -R a+rX "$TEST_ROOT"
          mkdir -m 0700 "$TEST_ROOT/private-home"
          export HOME="$TEST_ROOT/private-home"
          export COORDINATOR_TEST_PI="$TEST_ROOT/node_modules/.bin/pi"
          export COORDINATOR_TEST_OMP="$TEST_ROOT/node_modules/.bin/omp"
          export COORDINATOR_TEST_PI_VERSION='1.0.4'
          export COORDINATOR_TEST_OMP_VERSION='omp/18.6.1'
          cd "$TEST_ROOT"
          timeout --signal=TERM --kill-after=5s 600s sudo --preserve-env=PATH,HOME,COORDINATOR_TEST_PI,COORDINATOR_TEST_OMP,COORDINATOR_TEST_PI_VERSION,COORDINATOR_TEST_OMP_VERSION /usr/bin/setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --bounding-set=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --inh-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --ambient-caps=-all,+chown,+dac_override,+kill,+setuid,+setgid,+setpcap --no-new-privs "$(command -v node)" --import tsx scripts/host-smoke.ts
  # Stock controls and broker delivery do not admit whole-run prompt/outcome proof.
  # Ghostty rendering and real keyboard input remain separate acceptance.
