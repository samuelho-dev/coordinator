name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coordinator-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
        env:
          COORDINATOR_TEST_OMP: ${{ github.workspace }}/node_modules/.bin/omp
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/samuelho-dev/coordinator:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/samuelho-dev/coordinator
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attest exact image source
        env:
          IMAGE: ghcr.io/samuelho-dev/coordinator@${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          INVOCATION: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          cosign sign --yes "$IMAGE"
          jq -n --arg repo "$REPOSITORY" --arg sha "$SOURCE_SHA" --arg ref "$SOURCE_REF" --arg invocation "$INVOCATION" '{buildDefinition:{buildType:"https://actions.github.io/buildtypes/workflow/v1",externalParameters:{repository:$repo,ref:$ref,sha:$sha},resolvedDependencies:[{uri:("git+https://github.com/"+$repo),digest:{gitCommit:$sha}}]},runDetails:{builder:{id:("https://github.com/"+$repo+"/.github/workflows/ci.yaml@"+$ref)},metadata:{invocationId:$invocation}}}' > "$RUNNER_TEMP/provenance.json"
          cosign attest --yes --type https://slsa.dev/provenance/v1 --predicate "$RUNNER_TEMP/provenance.json" "$IMAGE"
          cosign verify --certificate-identity-regexp "^https://github.com/$REPOSITORY/" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          cosign verify-attestation --type https://slsa.dev/provenance/v1 --certificate-identity-regexp "^https://github.com/$REPOSITORY/" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          printf 'Image: `%s`\nSource SHA: `%s`\n' "$IMAGE" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
