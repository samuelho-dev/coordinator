packages:
  - .
  - packages/native-control
overrides:
  effect: 4.0.3
  '@effect/platform-node': 4.0.3
  '@effect/platform-node-shared': 4.0.3
  '@effect/sql-pg': 4.0.3
allowBuilds:
  '@google/genai': false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  # ponytail: Prisma's cloud/composer runtime is unused; local contract/migration CLI needs no workerd binary.
  workerd: false
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.0.4'
  - '@earendil-works/pi-agent-core@1.0.4'
  - '@earendil-works/pi-ai@1.0.4'
  - '@earendil-works/pi-codemode@1.0.4'
  - '@earendil-works/pi-coding-agent@1.0.4'
  - '@earendil-works/pi-mcp@1.0.4'
  - '@earendil-works/pi-telemetry@1.0.4'
  - '@earendil-works/pi-tui@1.0.4'
  - 'effect@4.0.3'
  - '@effect/platform-node@4.0.3'
  - '@effect/platform-node-shared@4.0.3'
  - '@effect/sql-pg@4.0.3'
  - '@effect/tsgo-darwin-arm64@0.49.0'
  - '@effect/tsgo-darwin-x64@0.49.0'
  - '@effect/tsgo-linux-arm64@0.49.0'
  - '@effect/tsgo-linux-arm@0.49.0'
  - '@effect/tsgo-linux-x64@0.49.0'
  - '@effect/tsgo-win32-arm64@0.49.0'
  - '@effect/tsgo-win32-x64@0.49.0'
  - '@effect/tsgo@0.49.0'
  - 'prisma-effect-kysely@9.0.2'
